services:
  - type: web
    name: tawseel-store
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        fromContext: env
      - key: VITE_SUPABASE_ANON_KEY
        fromContext: env
